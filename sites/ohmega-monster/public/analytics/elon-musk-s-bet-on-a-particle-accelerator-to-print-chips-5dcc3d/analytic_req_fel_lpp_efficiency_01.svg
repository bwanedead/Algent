    <text style="font-size: 7.4px; font-family: 'Consolas'; text-anchor: middle; fill: #858981" x="414.837844" y="449.091737" transform="rotate(-0 414.837844 449.091737)">FEL bars are lab projections (Optica OPN Nov 2025 / xLight) — no wafer exposure demonstrated. Nb3Sn cavities would cut FEL site draw to ~2 MW total (0.25 MW/scanner); also unproven at fab scale.</text>
