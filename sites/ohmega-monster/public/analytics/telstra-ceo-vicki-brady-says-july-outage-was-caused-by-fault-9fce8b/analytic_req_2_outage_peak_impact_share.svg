<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Peak mobile-service impact: share of calls and data sessions affected</title>
  <desc id="desc">At peak, Telstra reported approximately 45% of mobile calls and data sessions affected, and 55% not affected.</desc>

  <!-- background -->
  <rect width="640" height="320" fill="#0c0f0e"/>

  <!-- title -->
  <text x="32" y="36"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="13" fill="#f0ede4">Peak mobile-service impact: share affected</text>
  <text x="32" y="56"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="10" fill="#858981">Telstra mobile network · at peak · as of 2026-07-17</text>

  <!-- y-axis baseline area -->
  <line x1="32" y1="250" x2="608" y2="250" stroke="#2b302d" stroke-width="1"/>

  <!-- gridlines at 25/50/75/100 -->
  <g stroke="#2b302d" stroke-width="1">
    <line x1="32" y1="220" x2="608" y2="220"/>
    <line x1="32" y1="190" x2="608" y2="190"/>
    <line x1="32" y1="160" x2="608" y2="160"/>
    <line x1="32" y1="130" x2="608" y2="130"/>
  </g>

  <!-- y-axis labels (0–100%) -->
  <g font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
     font-size="10" fill="#858981" text-anchor="end">
    <text x="26" y="253">0%</text>
    <text x="26" y="223">25%</text>
    <text x="26" y="193">50%</text>
    <text x="26" y="163">75%</text>
    <text x="26" y="133">100%</text>
  </g>

  <!-- Bars: chart area from y=130 (100%) to y=250 (0%) → height 120px
       45% → 54px tall; 55% → 66px tall
       bar width 120, gap centered in remaining space -->
  <!-- Affected at peak: 45% -->
  <rect x="140" y="196" width="120" height="54" fill="#f0a33a"/>
  <text x="200" y="188"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="12" fill="#f0ede4" text-anchor="middle">45%</text>
  <text x="200" y="270"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="10" fill="#d3d0c8" text-anchor="middle">Affected</text>
  <text x="200" y="284"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="10" fill="#858981" text-anchor="middle">at peak</text>

  <!-- Not affected at peak: 55% — secondary amber -->
  <rect x="380" y="184" width="120" height="66" fill="#a96b1f"/>
  <text x="440" y="176"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="12" fill="#f0ede4" text-anchor="middle">55%</text>
  <text x="440" y="270"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="10" fill="#d3d0c8" text-anchor="middle">Not affected</text>
  <text x="440" y="284"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="10" fill="#858981" text-anchor="middle">at peak</text>

  <!-- source footnote -->
  <text x="32" y="308"
        font-family="IBM Plex Mono, Cascadia Mono, Menlo, Consolas, monospace"
        font-size="9" fill="#858981">Source: Telstra (approx. 45% of calls &amp; data sessions affected at peak)</text>
</svg>
