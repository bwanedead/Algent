    <text style="font-size: 7.5px; font-family: 'Consolas'; text-anchor: start; fill: #858981" x="129.303138" y="58.290406" transform="rotate(-0 129.303138 58.290406)">Europe: nearly balanced (dense monitoring)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7.5px; font-family: 'Consolas'; text-anchor: start; fill: #858981" x="129.303138" y="196.420836" transform="rotate(-0 129.303138 196.420836)">Tropics: expansions dominate; elevational shifts rarely documented</text>
   </g>
   <g id="text_27">
    <text style="font-size: 12px; font-family: 'Consolas'; text-anchor: start; fill: #f0ede4" x="122.976" y="28.509375" transform="rotate(-0 122.976 28.509375)">What kind of move was documented depends on where we looked</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-size: 6.4px; font-family: 'Consolas'; fill: #858981" transform="translate(20.16 327.144575)">Semi-quantitative: presence/absence of shift type, not km/decade rate.  65% of species have a single record; 23% show multiple shift types.</text>
   <text style="font-size: 6.4px; font-family: 'Consolas'; fill: #858981" transform="translate(20.16 334.506475)">Shares are of documented species-shift observations per region (ED Fig. 2), not of all ~19,327 butterflies. Dataset n=1,758 species.  Elevational shifts almost exclusively Northern Hemisphere.</text>
   <text style="font-size: 6.4px; font-family: 'Consolas'; fill: #858981" transform="translate(20.16 341.868375)">Source bias: English literature over-represents expansions (std. residual +2.94) and under-represents contractions (−4.14); expert assessments show the opposite (−4.68 / +5.73).</text>
  </g>
 </g>
