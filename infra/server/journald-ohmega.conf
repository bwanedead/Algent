# Cap the systemd journal (it was 562 MB and growing, uncapped). Installed to /etc/systemd/journald.conf.d/ohmega.conf by
# install_schedules.sh (needs sudo), or by hand:
#   sudo install -D -m 0644 ~/Algent/infra/server/journald-ohmega.conf /etc/systemd/journald.conf.d/ohmega.conf
#   sudo systemctl restart systemd-journald && sudo journalctl --vacuum-size=200M
# 200 MB holds weeks of the timers' one-line job output (live feeds log a line a run); the real run logs are in ~/runlogs and runs_data.
# `newsroom envelope` warns above 250 MB (cap not applied) and fails above 500 MB (cap not working).
[Journal]
SystemMaxUse=200M
SystemKeepFree=2G
MaxRetentionSec=1month
