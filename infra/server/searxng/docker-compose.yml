# SearXNG — Ohmega's own metasearch: one query fans out to many engines and rotates between them, so no single
# engine's rate limit (or paid quota) bottlenecks research. Bound to 127.0.0.1 only: never exposed to the
# internet; the pipeline on this server calls it locally, and a laptop reaches it through an SSH tunnel.
#
#   deploy:  infra/server/searxng/deploy.sh (copies these files, generates the secret, starts it)
services:
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on: [valkey]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set by deploy.sh in .env next to this file}

volumes:
  valkey-data:
